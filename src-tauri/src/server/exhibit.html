<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
  :root {
    color-scheme: light;
    --ink: #241910;
    --muted: #7b6d60;
    --paper: #f3ecdf;
    --card: #fffaf3;
    --line: #e4d6c4;
    --ember: #c45c26;
    --pine: #2f6b4f;
    --shadow: 0 16px 40px rgba(36, 25, 16, 0.08);
    --serif: "Iowan Old Style", Palatino, "Songti SC", "Noto Serif SC", serif;
    --sans: "Avenir Next", "PingFang SC", "Hiragino Sans GB", sans-serif;
  }
  body[data-theme="video"],
  body[data-paper="night"] {
    color-scheme: dark;
    --ink: #f6efe4;
    --muted: #b7a898;
    --paper: #14110e;
    --card: #221c16;
    --line: #3a3128;
    --shadow: 0 16px 40px rgba(0, 0, 0, 0.28);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background:
      radial-gradient(880px 380px at 0% -12%, rgba(196, 92, 38, 0.14), transparent 55%),
      var(--paper);
    color: var(--ink);
    font-family: var(--sans);
  }
  header, main { width: min(1080px, calc(100% - 2rem)); margin: 0 auto; }
  header { padding: 1.35rem 0 0.2rem; }
  h1 {
    margin: 0.2rem 0 0;
    font-family: var(--serif);
    font-weight: 500;
    font-size: clamp(1.8rem, 4vw, 2.7rem);
    letter-spacing: -0.03em;
  }
  #lede { margin: 0.35rem 0 0; color: var(--muted); line-height: 1.6; }
  main { padding: 0.8rem 0 5rem; }
  button, input { font: inherit; color: inherit; }
  .find {
    position: sticky;
    top: 0;
    z-index: 3;
    display: flex;
    align-items: center;
    gap: 0.7rem;
    margin: 0 0 0.85rem;
    padding: 0.35rem 0 0.7rem;
    background: color-mix(in srgb, var(--paper) 88%, transparent);
    backdrop-filter: blur(10px);
  }
  .find input {
    width: min(420px, 100%);
    border: 1px solid var(--line);
    background: var(--card);
    border-radius: 999px;
    padding: 0.55rem 0.95rem;
    outline: none;
  }
  .find input:focus { border-color: var(--ember); }
  .find span { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 0.82rem; }
  .photos {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
    gap: 0.4rem;
  }
  .photos button {
    appearance: none;
    aspect-ratio: 1;
    padding: 0;
    border: 0;
    border-radius: 0.75rem;
    overflow: hidden;
    background: color-mix(in srgb, var(--ink) 8%, var(--card));
    cursor: pointer;
  }
  .photos img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .now {
    position: sticky;
    top: 0;
    z-index: 2;
    margin-bottom: 0.8rem;
    padding: 0.95rem 1rem 1rem;
    border: 1px solid var(--line);
    border-radius: 1.2rem;
    background: color-mix(in srgb, var(--card) 92%, transparent);
    backdrop-filter: blur(12px);
    box-shadow: var(--shadow);
  }
  .now-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 1rem; }
  .kicker { margin: 0; color: var(--ember); font-size: 0.75rem; letter-spacing: 0.08em; }
  #track-title {
    margin: 0.15rem 0 0;
    font-family: var(--serif);
    font-size: clamp(1.35rem, 3vw, 1.9rem);
    font-weight: 500;
  }
  #track-sub { margin: 0.25rem 0 0; min-height: 1.2em; color: var(--muted); font-size: 0.85rem; }
  .transport { display: flex; gap: 0.45rem; }
  .transport button, .tools button, #lightbox button {
    border: 1px solid var(--line);
    background: var(--card);
    border-radius: 999px;
    padding: 0.4rem 0.85rem;
    cursor: pointer;
  }
  audio, video { width: 100%; margin-top: 0.75rem; }
  video {
    display: block;
    margin-top: 0;
    background: #000;
    border-radius: 1rem;
    max-height: 68vh;
  }
  .screen {
    position: relative;
    border-radius: 1rem;
    overflow: hidden;
    background: #0c0a08;
    min-height: 220px;
  }
  .screen-empty {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    margin: 0;
    color: #d9cbbd;
    pointer-events: none;
  }
  .list { display: flex; flex-direction: column; gap: 0.3rem; }
  .row {
    appearance: none;
    display: grid;
    grid-template-columns: 2.4rem minmax(0, 1fr) auto;
    gap: 0.65rem;
    align-items: center;
    width: 100%;
    text-align: left;
    border: 1px solid transparent;
    background: transparent;
    border-radius: 0.85rem;
    padding: 0.55rem 0.7rem;
    cursor: pointer;
  }
  .row.chapter { grid-template-columns: minmax(0, 1fr); }
  .row:hover { background: color-mix(in srgb, var(--ember) 8%, var(--card)); }
  .row[aria-current="true"] {
    border-color: var(--ember);
    background: color-mix(in srgb, var(--ember) 12%, var(--card));
  }
  .idx, .size { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 0.8rem; }
  .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .reader {
    display: grid;
    grid-template-columns: minmax(180px, 240px) minmax(0, 1fr);
    gap: 1.2rem;
    align-items: start;
  }
  article {
    max-width: 68ch;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 1.2rem;
    padding: clamp(1.1rem, 3vw, 2.2rem);
    box-shadow: var(--shadow);
    font-family: var(--serif);
    font-size: var(--read, 1.12rem);
    line-height: 1.95;
  }
  article h2, article h3 { font-weight: 500; line-height: 1.35; }
  article pre {
    overflow: auto;
    padding: 0.8rem 1rem;
    border-radius: 0.8rem;
    background: color-mix(in srgb, var(--ink) 6%, var(--card));
    font-family: ui-monospace, monospace;
    font-size: 0.86em;
    line-height: 1.5;
  }
  .tools { display: flex; flex-wrap: wrap; gap: 0.45rem; margin: 0 0 0.8rem; }
  iframe, embed { width: 100%; height: 78vh; border: 0; border-radius: 1rem; background: white; }
  #lightbox[hidden] { display: none; }
  #lightbox {
    position: fixed;
    inset: 0;
    z-index: 5;
    background: rgba(12, 9, 7, 0.92);
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: 0.8rem 1rem 1rem;
    color: #f6efe4;
  }
  #lightbox img { max-width: min(1200px, 100%); max-height: 100%; margin: auto; object-fit: contain; cursor: pointer; }
  #lightbox header, .nav { width: min(1200px, 100%); margin: 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 0.6rem; }
  #light-title { margin: 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .empty { color: var(--muted); padding: 1.5rem 0; }
  @media (max-width: 800px) {
    .reader, .now-top { grid-template-columns: 1fr; display: grid; }
    .photos { grid-template-columns: repeat(auto-fill, minmax(108px, 1fr)); }
  }
</style>
</head>
<body data-theme="{{THEME}}">
<header>
  <h1 id="title">{{TITLE}}</h1>
  <p id="lede"></p>
</header>
<main id="stage"></main>
<div id="lightbox" hidden>
  <header>
    <p id="light-title"></p>
    <button id="light-close" type="button">关闭</button>
  </header>
  <img id="light-img" alt="">
  <div class="nav">
    <button id="light-prev" type="button">上一张</button>
    <span id="light-count"></span>
    <button id="light-next" type="button">下一张</button>
  </div>
</div>
<script>
const theme = document.body.dataset.theme;
const stage = document.getElementById("stage");
const lede = document.getElementById("lede");
const hints = {
  image: "点开看大图，左右键换一张。",
  music: "点一首就开始，播完自动下一首。",
  video: "点一集再播，不会自己开始。",
  novel: "从左边选章节。字号和纸色会记住。",
  document: "选一份再打开。"
};
const caps = { image: 360, music: 400, video: 200, novel: 400, document: 200 };

function esc(value) {
  return String(value).replace(/[&<>"']/g, (ch) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  })[ch]);
}

function formatSize(bytes) {
  const size = Number(bytes) || 0;
  if (size < 1024) return size + " B";
  if (size < 1048576) return Math.max(1, Math.round(size / 1024)) + " KB";
  if (size < 1073741824) {
    const mb = size / 1048576;
    return (mb >= 10 ? Math.round(mb) : mb.toFixed(1)) + " MB";
  }
  return (size / 1073741824).toFixed(1) + " GB";
}

async function main() {
  let catalog;
  try {
    const response = await fetch("/_stall/catalog.json");
    if (!response.ok) throw new Error(String(response.status));
    catalog = await response.json();
  } catch (error) {
    stage.innerHTML = '<p class="empty">目录没有打开。</p>';
    return;
  }
  const items = catalog.items || [];
  const unit = { image: "张", music: "首", video: "个", novel: "篇", document: "份" }[theme] || "个";
  lede.textContent = items.length ? (items.length + " " + unit + " · " + (hints[theme] || "")) : "这个主题里还没有可以展示的文件。";
  if (!items.length) {
    stage.innerHTML = '<p class="empty">这个主题里还没有可以展示的文件。</p>';
    return;
  }
  const host = document.createElement("div");
  stage.append(host);
  const note = document.createElement("p");
  note.className = "empty";
  const persistent = theme === "music" ? renderMusic(host, items) : theme === "video" ? renderVideo(host, items) : null;
  const paint = (shown, hiddenNote) => {
    if (persistent) persistent(shown);
    else {
      host.replaceChildren();
      if (theme === "image") renderImages(host, shown);
      else if (theme === "novel") renderNovel(host, catalog.title || "", shown);
      else renderDocs(host, shown);
    }
    note.remove();
    if (hiddenNote) {
      note.textContent = hiddenNote;
      host.append(note);
    }
  };
  let query = "";
  const apply = () => {
    const matched = query ? items.filter((item) => String(item.title).toLowerCase().includes(query)) : items;
    const cap = caps[theme] || 400;
    const shown = matched.slice(0, cap);
    const hidden = matched.length - shown.length;
    paint(shown, hidden > 0 ? "先列出 " + shown.length + " 个。用搜索把范围缩小。" : "");
    return matched.length;
  };
  if (items.length >= 8) {
    const bar = document.createElement("label");
    bar.className = "find";
    const input = document.createElement("input");
    input.type = "search";
    input.placeholder = "找文件名";
    input.autocomplete = "off";
    input.setAttribute("aria-label", "找文件名");
    const meta = document.createElement("span");
    bar.append(input, meta);
    stage.insertBefore(bar, host);
    input.addEventListener("input", () => {
      query = input.value.trim().toLowerCase();
      meta.textContent = apply() + " / " + items.length;
    });
    meta.textContent = items.length + " 个";
  }
  apply();
  if (catalog.truncated) {
    const note = document.createElement("p");
    note.className = "empty";
    note.textContent = "文件太多，这次只铺开了前面的一部分。";
    stage.append(note);
  }
}

function renderImages(host, items) {
  const grid = document.createElement("div");
  grid.className = "photos";
  items.forEach((item, index) => {
    const button = document.createElement("button");
    button.type = "button";
    button.title = item.title;
    const img = document.createElement("img");
    img.alt = item.title;
    img.loading = "lazy";
    img.decoding = "async";
    img.src = item.path;
    button.append(img);
    button.addEventListener("click", () => openLight(items, index));
    grid.append(button);
  });
  host.append(grid);
}

let lightIndex = 0;
let lightItems = [];
function openLight(items, index) {
  lightItems = items;
  lightIndex = index;
  paintLight();
  document.getElementById("lightbox").hidden = false;
}
function paintLight() {
  const item = lightItems[lightIndex];
  const img = document.getElementById("light-img");
  img.src = item.path;
  img.alt = item.title;
  document.getElementById("light-title").textContent = item.title + " · " + formatSize(item.size);
  document.getElementById("light-count").textContent = (lightIndex + 1) + " / " + lightItems.length;
}
document.getElementById("light-close").onclick = () => { document.getElementById("lightbox").hidden = true; };
document.getElementById("light-prev").onclick = () => stepLight(-1);
document.getElementById("light-next").onclick = () => stepLight(1);
document.getElementById("light-img").onclick = () => stepLight(1);
function stepLight(delta) {
  if (!lightItems.length) return;
  lightIndex = (lightIndex + delta + lightItems.length) % lightItems.length;
  paintLight();
}
document.addEventListener("keydown", (event) => {
  const box = document.getElementById("lightbox");
  if (box.hidden) return;
  if (event.key === "Escape") box.hidden = true;
  if (event.key === "ArrowLeft") stepLight(-1);
  if (event.key === "ArrowRight") stepLight(1);
});

function renderMusic(host, all) {
  const now = document.createElement("div");
  now.className = "now";
  now.innerHTML = '<div class="now-top"><div><p class="kicker" id="kicker">准备好了</p><h2 id="track-title">选一首</h2><p id="track-sub">不会自动出声。</p></div><div class="transport"><button type="button" id="prev">上一首</button><button type="button" id="next">下一首</button></div></div>';
  const audio = document.createElement("audio");
  audio.controls = true;
  audio.preload = "none";
  now.append(audio);
  if (all.length >= 8) now.style.top = "3.2rem";
  const list = document.createElement("div");
  list.className = "list";
  host.append(now, list);
  let cursor = -1;

  const sub = () => document.getElementById("track-sub");
  const showBuffer = () => {
    const title = audio.dataset.title || "";
    if (!audio.buffered.length || !isFinite(audio.duration) || audio.duration <= 0) {
      sub().textContent = title ? "正在打开 " + title : "不会自动出声。";
      return;
    }
    if (!audio.paused && audio.readyState >= 3) {
      sub().textContent = formatSize(all[cursor] && all[cursor].size);
      return;
    }
    const end = audio.buffered.end(audio.buffered.length - 1);
    sub().textContent = "正在缓冲 " + Math.min(99, Math.round(end / audio.duration * 100)) + "%";
  };
  audio.addEventListener("waiting", showBuffer);
  audio.addEventListener("progress", showBuffer);
  audio.addEventListener("playing", () => {
    document.getElementById("kicker").textContent = "正在听";
    sub().textContent = formatSize(all[cursor] && all[cursor].size);
  });
  audio.addEventListener("pause", () => {
    if (audio.ended || cursor < 0) return;
    document.getElementById("kicker").textContent = "已暂停";
  });

  function mark() {
    const current = all[cursor];
    list.querySelectorAll(".row").forEach((node) => {
      if (current && node.dataset.path === current.path) node.setAttribute("aria-current", "true");
      else node.removeAttribute("aria-current");
    });
  }
  let blobUrl = "";
  let playToken = 0;
  function failPlay(message) {
    document.getElementById("kicker").textContent = "播不了";
    sub().textContent = message || "请再点一次";
  }
  audio.addEventListener("error", () => {
    const code = audio.error && audio.error.code;
    if (code === 4) failPlay("格式或响应不被支持，正在改用整段缓冲…");
  });
  async function playAt(index) {
    if (index < 0 || index >= all.length) return;
    const token = ++playToken;
    cursor = index;
    const item = all[index];
    document.getElementById("kicker").textContent = "正在打开";
    document.getElementById("track-title").textContent = item.title;
    sub().textContent = "正在接通 " + formatSize(item.size);
    audio.dataset.title = item.title;
    if (blobUrl) {
      URL.revokeObjectURL(blobUrl);
      blobUrl = "";
    }
    mark();
    try {
      audio.src = item.path;
      await audio.play();
      if (token !== playToken) return;
    } catch (error) {
      if (token !== playToken) return;
      sub().textContent = "直连播不了，改缓冲整首…";
      try {
        const res = await fetch(item.path);
        if (token !== playToken) return;
        if (!res.ok) throw new Error("取歌失败 " + res.status);
        const blob = await res.blob();
        if (token !== playToken) return;
        blobUrl = URL.createObjectURL(blob);
        audio.src = blobUrl;
        await audio.play();
      } catch (fallback) {
        if (token !== playToken) return;
        failPlay(
          (fallback && fallback.message) ||
            (error && error.message) ||
            "请再点一次"
        );
      }
    }
  }
  now.querySelector("#prev").onclick = () => playAt(cursor < 0 ? 0 : cursor - 1);
  now.querySelector("#next").onclick = () => playAt(cursor < 0 ? 0 : cursor + 1);
  audio.addEventListener("ended", () => {
    if (cursor + 1 < all.length) playAt(cursor + 1);
    else document.getElementById("kicker").textContent = "最后一首听完了";
  });
  document.addEventListener("keydown", (event) => {
    if (typing(event) || !document.getElementById("lightbox").hidden) return;
    if (event.key === " " && cursor >= 0) {
      event.preventDefault();
      if (audio.paused) audio.play();
      else audio.pause();
    }
    if (event.key === "ArrowDown") { event.preventDefault(); playAt(cursor + 1); }
    if (event.key === "ArrowUp") { event.preventDefault(); playAt(cursor - 1); }
  });
  return (shown) => {
    list.replaceChildren();
    shown.forEach((item) => {
      const index = all.indexOf(item);
      const button = document.createElement("button");
      button.type = "button";
      button.className = "row";
      button.dataset.path = item.path;
      button.innerHTML = '<span class="idx">' + String(index + 1).padStart(2, "0") + '</span><span class="name"></span><span class="size"></span>';
      button.querySelector(".name").textContent = item.title;
      button.querySelector(".size").textContent = formatSize(item.size);
      button.addEventListener("click", () => playAt(index));
      list.append(button);
    });
    mark();
  };
}

function renderVideo(host, all) {
  const screen = document.createElement("div");
  screen.className = "screen";
  const video = document.createElement("video");
  video.controls = true;
  video.playsInline = true;
  video.preload = "none";
  const empty = document.createElement("p");
  empty.className = "screen-empty";
  empty.textContent = "点下面一集再播";
  screen.append(video, empty);
  const transport = document.createElement("div");
  transport.className = "transport";
  transport.style.margin = "0.7rem 0";
  transport.innerHTML = '<button type="button" id="prev">上一集</button><button type="button" id="next">下一集</button>';
  const title = document.createElement("p");
  title.id = "track-sub";
  const list = document.createElement("div");
  list.className = "list";
  host.append(screen, transport, title, list);
  let cursor = -1;
  function mark() {
    const current = all[cursor];
    list.querySelectorAll(".row").forEach((node) => {
      if (current && node.dataset.path === current.path) node.setAttribute("aria-current", "true");
      else node.removeAttribute("aria-current");
    });
  }
  function playAt(index) {
    if (index < 0 || index >= all.length) return;
    cursor = index;
    const item = all[index];
    empty.hidden = true;
    title.textContent = "正在接通 " + item.title;
    video.src = item.path;
    mark();
    const play = video.play();
    if (play && play.catch) {
      play.catch((error) => {
        title.textContent = "播不了：" + (error && error.message ? error.message : "请再点一次");
      });
    }
  }
  video.addEventListener("playing", () => {
    const item = all[cursor];
    title.textContent = item ? item.title + " · " + formatSize(item.size) : "";
  });
  video.addEventListener("waiting", () => {
    const item = all[cursor];
    if (item) title.textContent = "正在缓冲 " + item.title;
  });
  video.addEventListener("progress", () => {
    if (video.readyState >= 3 || !video.buffered.length || cursor < 0) return;
    if (!isFinite(video.duration) || video.duration <= 0) return;
    const end = video.buffered.end(video.buffered.length - 1);
    title.textContent = "正在缓冲 " + Math.min(99, Math.round(end / video.duration * 100)) + "%";
  });
  video.addEventListener("ended", () => {
    if (cursor + 1 < all.length) playAt(cursor + 1);
  });
  transport.querySelector("#prev").onclick = () => playAt(cursor < 0 ? 0 : cursor - 1);
  transport.querySelector("#next").onclick = () => playAt(cursor < 0 ? 0 : cursor + 1);
  return (shown) => {
    list.replaceChildren();
    shown.forEach((item) => {
      const index = all.indexOf(item);
      const button = document.createElement("button");
      button.type = "button";
      button.className = "row";
      button.dataset.path = item.path;
      button.innerHTML = '<span class="idx">' + String(index + 1).padStart(2, "0") + '</span><span class="name"></span><span class="size"></span>';
      button.querySelector(".name").textContent = item.title;
      button.querySelector(".size").textContent = formatSize(item.size);
      button.addEventListener("click", () => playAt(index));
      list.append(button);
    });
    mark();
  };
}

function renderNovel(host, stallTitle, items) {
  const saved = Number(localStorage.getItem("popstall-read-size") || "18");
  document.documentElement.style.setProperty("--read", saved + "px");
  if (localStorage.getItem("popstall-paper") === "night") document.body.dataset.paper = "night";
  const tools = document.createElement("div");
  tools.className = "tools";
  tools.innerHTML = '<button type="button" id="smaller">小一点</button><button type="button" id="larger">大一点</button><button type="button" id="paper">换纸色</button>';
  const wrap = document.createElement("div");
  wrap.className = "reader";
  const list = document.createElement("div");
  list.className = "list";
  const article = document.createElement("article");
  article.textContent = "选一个章节。";
  const memoryKey = "popstall-chapter:" + stallTitle;
  const remembered = localStorage.getItem(memoryKey);
  let opened = false;
  items.forEach((item) => {
    const button = document.createElement("button");
    button.className = "row chapter";
    button.type = "button";
    button.innerHTML = '<span class="name"></span>';
    button.querySelector(".name").textContent = item.title;
    button.addEventListener("click", () => openChapter(item, button, article, list, memoryKey));
    list.append(button);
    if (!opened && (!remembered || remembered === item.path)) {
      opened = true;
      button.click();
    }
  });
  if (!opened && list.firstChild) list.firstChild.click();
  wrap.append(list, article);
  host.append(tools, wrap);
  document.getElementById("smaller").onclick = () => resize(-1);
  document.getElementById("larger").onclick = () => resize(1);
  document.getElementById("paper").onclick = () => {
    const night = document.body.dataset.paper !== "night";
    if (night) document.body.dataset.paper = "night";
    else delete document.body.dataset.paper;
    localStorage.setItem("popstall-paper", night ? "night" : "day");
  };
}

function resize(delta) {
  const current = Number(getComputedStyle(document.documentElement).getPropertyValue("--read").replace("px", "")) || 18;
  const next = Math.min(28, Math.max(15, current + delta));
  document.documentElement.style.setProperty("--read", next + "px");
  localStorage.setItem("popstall-read-size", String(next));
}

async function openChapter(item, button, article, list, memoryKey) {
  list.querySelectorAll(".row").forEach((node) => node.removeAttribute("aria-current"));
  button.setAttribute("aria-current", "true");
  localStorage.setItem(memoryKey, item.path);
  article.style.whiteSpace = "normal";
  article.textContent = "正在翻开…";
  try {
    const response = await fetch(item.path);
    if (!response.ok) {
      article.textContent = "这一章打不开（" + response.status + "）。换一章或返回重进摊位。";
      return;
    }
    const text = await response.text();
    if (item.path.toLowerCase().endsWith(".txt")) {
      article.style.whiteSpace = "pre-wrap";
      article.textContent = text;
      return;
    }
    article.innerHTML = markdown(text);
  } catch (error) {
    article.textContent = "这一章加载失败：" + (error && error.message ? error.message : "网络中断");
  }
}

function markdown(raw) {
  const lines = String(raw).replaceAll("\r\n", "\n").split("\n");
  let html = "";
  let list = false;
  let code = false;
  let buffer = "";
  const flush = () => {
    if (!buffer.trim()) { buffer = ""; return; }
    html += "<p>" + inline(buffer.trim()) + "</p>";
    buffer = "";
  };
  for (const line of lines) {
    if (line.startsWith("```")) {
      if (code) { html += "<pre><code>" + esc(buffer) + "</code></pre>"; buffer = ""; code = false; }
      else { flush(); code = true; }
      continue;
    }
    if (code) { buffer += (buffer ? "\n" : "") + line; continue; }
    if (/^[-*] /.test(line)) {
      flush();
      if (!list) { html += "<ul>"; list = true; }
      html += "<li>" + inline(line.slice(2)) + "</li>";
      continue;
    }
    if (list) { html += "</ul>"; list = false; }
    if (line.startsWith("### ")) { flush(); html += "<h3>" + inline(line.slice(4)) + "</h3>"; continue; }
    if (line.startsWith("## ")) { flush(); html += "<h2>" + inline(line.slice(3)) + "</h2>"; continue; }
    if (line.startsWith("# ")) { flush(); html += "<h2>" + inline(line.slice(2)) + "</h2>"; continue; }
    if (!line.trim()) flush();
    else buffer += (buffer ? " " : "") + line;
  }
  if (code) html += "<pre><code>" + esc(buffer) + "</code></pre>";
  else flush();
  if (list) html += "</ul>";
  return html;
}

function inline(value) {
  return esc(value)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\[([^\]]+)\]\((\/[^)\s]*)\)/g, '<a href="$2">$1</a>');
}

function renderDocs(host, items) {
  const list = document.createElement("div");
  list.className = "list";
  const frame = document.createElement("iframe");
  frame.hidden = true;
  function openDoc(item, button) {
    frame.hidden = false;
    frame.title = item.title;
    frame.src = item.path;
    list.querySelectorAll(".row").forEach((node) => node.removeAttribute("aria-current"));
    button.setAttribute("aria-current", "true");
  }
  items.forEach((item, index) => {
    const button = document.createElement("button");
    button.className = "row";
    button.type = "button";
    button.innerHTML = '<span class="idx">' + String(index + 1).padStart(2, "0") + '</span><span class="name"></span><span class="size"></span>';
    button.querySelector(".name").textContent = item.title;
    button.querySelector(".size").textContent = formatSize(item.size);
    button.addEventListener("click", () => openDoc(item, button));
    list.append(button);
    if (items.length === 1) openDoc(item, button);
  });
  host.append(list, frame);
}

function typing(event) {
  const target = event.target;
  if (!target || !target.tagName) return false;
  const tag = target.tagName;
  return tag === "INPUT" || tag === "TEXTAREA" || target.isContentEditable;
}

main();
