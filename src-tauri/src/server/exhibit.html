<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
  :root {
    color-scheme: light;
    --ink: #241910;
    --muted: #7b6d60;
    --paper: #f3ecdf;
    --card: #fffaf3;
    --line: #e4d6c4;
    --ember: #c45c26;
    --pine: #2f6b4f;
    --shadow: 0 16px 40px rgba(36, 25, 16, 0.08);
    --serif: "Iowan Old Style", Palatino, "Songti SC", "Noto Serif SC", serif;
    --sans: "Avenir Next", "PingFang SC", "Hiragino Sans GB", sans-serif;
  }
  body[data-theme="video"],
  body[data-paper="night"] {
    color-scheme: dark;
    --ink: #f6efe4;
    --muted: #b7a898;
    --paper: #14110e;
    --card: #221c16;
    --line: #3a3128;
    --shadow: 0 16px 40px rgba(0, 0, 0, 0.28);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background:
      radial-gradient(880px 380px at 0% -12%, rgba(196, 92, 38, 0.14), transparent 55%),
      var(--paper);
    color: var(--ink);
    font-family: var(--sans);
  }
  /* Stage chrome already shows the title — never paint a second page header. */
  body > header { display: none; }
  main {
    width: min(1240px, calc(100% - 1.5rem));
    margin: 0 auto;
    padding: 0.55rem 0 1rem;
  }
  /* Theme workspaces fill the child webview (no half-height gap / double scroll). */
  body[data-theme="novel"],
  body[data-theme="document"],
  body[data-theme="music"],
  body[data-theme="video"] {
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  body[data-theme="novel"] main,
  body[data-theme="document"] main,
  body[data-theme="music"] main,
  body[data-theme="video"] main {
    flex: 1;
    min-height: 0;
    width: auto;
    max-width: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
  }
  .workspace {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(240px, 300px) minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr);
  }
  .workspace-bar {
    grid-column: 1 / -1;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.45rem 0.65rem;
    padding: 0.5rem 0.85rem;
    border-bottom: 1px solid var(--line);
    background: color-mix(in srgb, var(--card) 92%, var(--paper));
  }
  .workspace-bar .seg {
    display: inline-flex;
    align-items: center;
    gap: 0.2rem;
    padding: 0.15rem;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--card);
  }
  .workspace-bar .seg button {
    border: 0;
    background: transparent;
    border-radius: 999px;
    padding: 0.28rem 0.65rem;
    cursor: pointer;
  }
  .workspace-bar .seg button:hover {
    background: color-mix(in srgb, var(--ember) 10%, var(--card));
  }
  .workspace-bar input[type="search"] {
    width: min(280px, 42vw);
    border: 1px solid var(--line);
    background: var(--card);
    border-radius: 999px;
    padding: 0.4rem 0.8rem;
    outline: none;
  }
  .workspace-bar input[type="search"]:focus { border-color: var(--ember); }
  .workspace-bar .meta {
    color: var(--muted);
    font-size: 0.8rem;
    font-variant-numeric: tabular-nums;
  }
  .workspace-bar .tools {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
    margin: 0;
    margin-left: auto;
  }
  .workspace .shelf,
  .workspace .side {
    min-height: 0;
    overflow: auto;
    padding: 0.45rem 0.35rem 0.6rem 0.55rem;
    border-right: 1px solid var(--line);
    background: color-mix(in srgb, var(--paper) 70%, var(--card));
  }
  .workspace .pane {
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    padding: 0.55rem 0.75rem 0.75rem;
  }
  button, input { font: inherit; color: inherit; }
  .find {
    position: sticky;
    top: 0;
    z-index: 3;
    display: flex;
    align-items: center;
    gap: 0.55rem;
    margin: 0 0 0.55rem;
    padding: 0.15rem 0 0.5rem;
    background: color-mix(in srgb, var(--paper) 92%, transparent);
    backdrop-filter: blur(10px);
  }
  .find .lede-inline {
    color: var(--muted);
    font-size: 0.8rem;
    white-space: nowrap;
  }
  .find input {
    width: min(420px, 100%);
    border: 1px solid var(--line);
    background: var(--card);
    border-radius: 999px;
    padding: 0.45rem 0.85rem;
    outline: none;
  }
  .find input:focus { border-color: var(--ember); }
  .find span { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 0.82rem; }
  .photos {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
    gap: 0.4rem;
  }
  .photos button {
    appearance: none;
    aspect-ratio: 1;
    padding: 0;
    border: 0;
    border-radius: 0.75rem;
    overflow: hidden;
    background: color-mix(in srgb, var(--ink) 8%, var(--card));
    cursor: pointer;
  }
  .photos img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .music-shell {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  .music-shell .workspace-bar { flex-shrink: 0; }
  .music-shell .playlist {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 0.45rem 0.75rem 0.6rem;
  }
  .music-dock {
    flex-shrink: 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 0.75rem 1rem;
    align-items: center;
    padding: 0.65rem 0.9rem 0.75rem;
    border-top: 1px solid var(--line);
    background: color-mix(in srgb, var(--card) 94%, var(--paper));
  }
  .music-dock .now-copy { min-width: 0; }
  .kicker { margin: 0; color: var(--ember); font-size: 0.72rem; letter-spacing: 0.06em; }
  #track-title {
    margin: 0.1rem 0 0;
    font-family: var(--serif);
    font-size: clamp(1.05rem, 2.2vw, 1.35rem);
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #track-sub { margin: 0.15rem 0 0; min-height: 1.1em; color: var(--muted); font-size: 0.8rem; }
  .music-dock .dock-controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.45rem;
    justify-content: flex-end;
  }
  .music-dock audio {
    width: min(320px, 42vw);
    margin: 0;
    height: 2rem;
  }
  .cinema {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(220px, 280px) minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr);
  }
  .cinema .workspace-bar { grid-column: 1 / -1; }
  .cinema .side {
    min-height: 0;
    overflow: auto;
    padding: 0.45rem 0.35rem 0.6rem 0.55rem;
    border-right: 1px solid var(--line);
    background: color-mix(in srgb, var(--paper) 40%, #0c0a08);
  }
  .cinema .stage-player {
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    padding: 0.65rem 0.85rem 0.85rem;
    background: #0c0a08;
    color: #f6efe4;
  }
  .cinema .stage-player .now-copy { margin-bottom: 0.55rem; }
  .cinema .stage-player #track-sub { color: #b7a898; }
  .transport { display: flex; flex-wrap: wrap; gap: 0.45rem; }
  .transport button, .tools button, .dock-controls button, #lightbox button {
    border: 1px solid var(--line);
    background: var(--card);
    border-radius: 999px;
    padding: 0.4rem 0.85rem;
    cursor: pointer;
  }
  .cinema .transport button {
    border-color: #3a3128;
    background: #221c16;
    color: #f6efe4;
  }
  audio, video { width: 100%; }
  .cinema video {
    display: block;
    flex: 1;
    min-height: 0;
    width: 100%;
    margin: 0;
    background: #000;
    border-radius: 0.85rem;
    object-fit: contain;
  }
  .screen {
    position: relative;
    flex: 1;
    min-height: 0;
    border-radius: 0.85rem;
    overflow: hidden;
    background: #000;
    display: flex;
    flex-direction: column;
  }
  .screen-empty {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    margin: 0;
    color: #d9cbbd;
    pointer-events: none;
  }
  .list { display: flex; flex-direction: column; gap: 0.25rem; }
  .row {
    appearance: none;
    display: grid;
    grid-template-columns: 2.1rem minmax(0, 1fr) auto;
    gap: 0.45rem 0.55rem;
    align-items: center;
    width: 100%;
    text-align: left;
    border: 1px solid transparent;
    background: transparent;
    border-radius: 0.85rem;
    padding: 0.5rem 0.55rem;
    cursor: pointer;
  }
  .row.has-dl { grid-template-columns: 2.1rem minmax(0, 1fr) auto auto; }
  .row.chapter { grid-template-columns: minmax(0, 1fr); }
  .row:hover { background: color-mix(in srgb, var(--ember) 8%, var(--card)); }
  .row[aria-current="true"] {
    border-color: var(--ember);
    background: color-mix(in srgb, var(--ember) 12%, var(--card));
  }
  .idx, .size {
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    font-size: 0.78rem;
    white-space: nowrap;
  }
  .size { justify-self: end; }
  /* Two-line clamp + hover title for the full name (middle ellipsis in JS). */
  .name {
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
    overflow: hidden;
    line-height: 1.35;
    word-break: break-word;
    overflow-wrap: anywhere;
  }
  .dl {
    appearance: none;
    border: 1px solid color-mix(in srgb, var(--ember) 45%, var(--line));
    background: color-mix(in srgb, var(--ember) 10%, var(--card));
    border-radius: 999px;
    padding: 0.22rem 0.65rem;
    font-size: 0.75rem;
    color: var(--ember);
    cursor: pointer;
    white-space: nowrap;
  }
  .dl:hover { background: color-mix(in srgb, var(--ember) 18%, var(--card)); color: var(--ink); }
  .dl:disabled { opacity: 0.5; cursor: default; }
  .pager {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.45rem;
    flex-shrink: 0;
    margin: 0 0 0.5rem;
    padding: 0.35rem 0.55rem;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--card);
    color: var(--muted);
    font-size: 0.85rem;
  }
  .pager button {
    border: 1px solid var(--line);
    background: var(--paper);
    border-radius: 999px;
    padding: 0.3rem 0.8rem;
    cursor: pointer;
  }
  .pager button:disabled { opacity: 0.4; cursor: default; }
  .pager .page-meta {
    min-width: 5.5rem;
    text-align: center;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
  }
  article {
    flex: 1;
    min-height: 0;
    overflow: auto;
    width: min(100%, 42rem);
    max-width: 72ch;
    margin: 0 auto;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 1rem;
    padding: clamp(1.1rem, 2.4vw, 1.85rem);
    box-shadow: var(--shadow);
    font-family: var(--serif);
    font-size: var(--read, 1.12rem);
    line-height: 1.85;
    overflow-wrap: anywhere;
  }
  article p { margin: 0 0 0.95em; }
  article p:last-child { margin-bottom: 0; }
  article h2, article h3 { font-weight: 500; line-height: 1.35; }
  article pre {
    overflow: auto;
    padding: 0.8rem 1rem;
    border-radius: 0.8rem;
    background: color-mix(in srgb, var(--ink) 6%, var(--card));
    font-family: ui-monospace, monospace;
    font-size: 0.86em;
    line-height: 1.5;
  }
  .tools { display: flex; flex-wrap: wrap; gap: 0.45rem; margin: 0 0 0.55rem; flex-shrink: 0; }
  .pdf-pane {
    flex: 1;
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    background: #2a241e;
    border-radius: 1rem;
    overflow: hidden;
  }
  .pdf-pane .pager {
    border-color: #3a3128;
    color: #d9cbbd;
    margin: 0.55rem 0.55rem 0;
  }
  .pdf-scroll {
    flex: 1;
    min-height: 0;
    overflow: auto;
    display: grid;
    place-items: start center;
    padding: 0.75rem;
  }
  .pdf-scroll canvas {
    max-width: 100%;
    height: auto;
    background: #fff;
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.35);
  }
  .doc-status {
    flex: 1;
    display: grid;
    place-items: center;
    color: var(--muted);
    padding: 1rem;
    text-align: center;
  }
  iframe, embed { width: 100%; height: 78vh; border: 0; border-radius: 1rem; background: white; }
  #lightbox[hidden] { display: none; }
  #lightbox {
    position: fixed;
    inset: 0;
    z-index: 5;
    background: rgba(12, 9, 7, 0.94);
    display: grid;
    grid-template-rows: auto minmax(0, 1fr) auto;
    padding: 0.65rem 0.85rem 0.85rem;
    color: #f6efe4;
    gap: 0.45rem;
  }
  #lightbox header, .nav {
    width: min(1200px, 100%);
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.6rem;
    flex-wrap: wrap;
  }
  #light-title { margin: 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  #light-viewport {
    min-height: 0;
    overflow: auto;
    overscroll-behavior: contain;
    border-radius: 0.75rem;
    background: #0a0806;
    cursor: grab;
    display: grid;
    place-items: center;
  }
  #light-viewport.is-panning { cursor: grabbing; }
  #light-img {
    display: block;
    max-width: none;
    max-height: none;
    width: auto;
    height: auto;
    margin: 0;
    user-select: none;
    -webkit-user-drag: none;
    transform-origin: center center;
  }
  #lightbox .zoom-tools { display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center; }
  .empty { color: var(--muted); padding: 1.5rem 0; }
  @media (max-width: 800px) {
    .workspace {
      grid-template-columns: 1fr;
      grid-template-rows: auto minmax(9rem, 32vh) minmax(0, 1fr);
    }
    .workspace .shelf,
    .workspace .side {
      border-right: 0;
      border-bottom: 1px solid var(--line);
    }
    .workspace .pane { grid-row: 3; }
    .cinema {
      grid-template-columns: 1fr;
      grid-template-rows: auto minmax(8rem, 28vh) minmax(0, 1fr);
    }
    .cinema .side {
      border-right: 0;
      border-bottom: 1px solid var(--line);
    }
    .cinema .stage-player { grid-row: 3; }
    .music-dock {
      grid-template-columns: 1fr;
    }
    .music-dock .dock-controls { justify-content: flex-start; }
    .music-dock audio { width: 100%; }
    .photos { grid-template-columns: repeat(auto-fill, minmax(108px, 1fr)); }
    .row.has-dl { grid-template-columns: 2rem minmax(0, 1fr) auto; }
    .row.has-dl .size { display: none; }
  }
</style>
</head>
<body data-theme="{{THEME}}">
<header>
  <h1 id="title">{{TITLE}}</h1>
  <p id="lede"></p>
</header>
<main id="stage"></main>
<div id="lightbox" hidden>
  <header>
    <p id="light-title"></p>
    <div class="zoom-tools">
      <button id="light-zoom-out" type="button" title="缩小">−</button>
      <button id="light-zoom-fit" type="button" title="适应窗口">适应</button>
      <button id="light-zoom-100" type="button" title="实际大小">100%</button>
      <button id="light-zoom-in" type="button" title="放大">+</button>
      <button id="light-save" type="button" class="dl">↓ 下载</button>
      <button id="light-close" type="button">关闭</button>
    </div>
  </header>
  <div id="light-viewport">
    <img id="light-img" alt="">
  </div>
  <div class="nav">
    <button id="light-prev" type="button">上一张</button>
    <span id="light-count"></span>
    <button id="light-next" type="button">下一张</button>
  </div>
</div>
<script>
const theme = document.body.dataset.theme;
const stage = document.getElementById("stage");
const lede = document.getElementById("lede");
const hints = {
  image: "网格是缩略图；点开看原图，可缩放拖拽，也可下载。",
  music: "点一首听；下载会弹出系统保存位置。",
  video: "点一集再播；下载会弹出系统保存位置。",
  novel: "从左边选章节。字号和纸色会记住。",
  document: "选一份打开；下载会弹出系统保存位置。"
};
const caps = { image: 360, music: 400, video: 200, novel: 400, document: 200 };

function esc(value) {
  return String(value).replace(/[&<>"']/g, (ch) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  })[ch]);
}

function formatSize(bytes) {
  const size = Number(bytes) || 0;
  if (size < 1024) return size + " B";
  if (size < 1048576) return Math.max(1, Math.round(size / 1024)) + " KB";
  if (size < 1073741824) {
    const mb = size / 1048576;
    return (mb >= 10 ? Math.round(mb) : mb.toFixed(1)) + " MB";
  }
  return (size / 1073741824).toFixed(1) + " GB";
}

/** Keep extension visible; ellipsize the middle for long titles. */
function displayName(title, maxChars) {
  const s = String(title || "").trim() || "未命名";
  const limit = maxChars || 40;
  if ([...s].length <= limit) return s;
  const chars = [...s];
  const extMatch = s.match(/(\.[A-Za-z0-9]{1,8})$/);
  const ext = extMatch ? extMatch[1] : "";
  const extLen = ext ? [...ext].length : 0;
  const budget = Math.max(10, limit - extLen - 1);
  const head = Math.ceil(budget * 0.62);
  const tail = budget - head;
  const base = ext ? chars.slice(0, chars.length - extLen) : chars;
  return base.slice(0, head).join("") + "…" + base.slice(-tail).join("") + ext;
}

function fileNameForSave(title, path) {
  const raw = String(title || "").trim();
  if (raw && /\.[A-Za-z0-9]{1,8}$/.test(raw)) return raw.replace(/[\\/:*?"<>|]/g, "_");
  const fromPath = String(path || "").split("/").pop() || "";
  const cleaned = (raw || fromPath || "download").replace(/[\\/:*?"<>|]/g, "_");
  if (/\.[A-Za-z0-9]{1,8}$/.test(cleaned)) return cleaned;
  const ext = (fromPath.match(/(\.[A-Za-z0-9]{1,8})$/) || [])[1] || "";
  return cleaned + ext;
}

/** Stage webview has no Tauri IPC — navigate to save-as; Rust intercepts and opens a save dialog. */
function downloadItem(item, trigger) {
  if (!item || !item.path) return;
  const button = trigger || null;
  const previous = button ? button.textContent : "";
  const filename = fileNameForSave(item.title, item.path);
  const url = "/_stall/save-as?path=" + encodeURIComponent(item.path) +
    "&name=" + encodeURIComponent(filename);
  if (button) {
    button.disabled = true;
    button.textContent = "选位置…";
  }
  try {
    // Assign is cancelled by the stage navigation hook; the page stays put.
    window.location.assign(url);
  } catch (error) {
    window.alert((error && error.message) || "下载失败");
  } finally {
    window.setTimeout(() => {
      if (button) {
        button.disabled = false;
        button.textContent = previous || "↓ 下载";
      }
    }, 800);
  }
}

function thumbPath(mediaPath) {
  const path = String(mediaPath || "");
  if (!path.startsWith("/media/")) return path;
  return "/_stall/thumb" + path;
}

function makeFileRow(item, index, options) {
  const opts = options || {};
  // Avoid <button> inside <button>: downloadable rows are a div with a child .dl.
  const row = document.createElement(opts.download ? "div" : "button");
  if (!opts.download) row.type = "button";
  row.className = "row" + (opts.download ? " has-dl" : "");
  row.dataset.path = item.path;
  row.title = item.title;
  if (opts.download) {
    row.setAttribute("role", "button");
    row.tabIndex = 0;
  }
  const idx = document.createElement("span");
  idx.className = "idx";
  idx.textContent = String(index + 1).padStart(2, "0");
  const name = document.createElement("span");
  name.className = "name";
  name.textContent = displayName(item.title);
  const size = document.createElement("span");
  size.className = "size";
  size.textContent = formatSize(item.size);
  row.append(idx, name, size);
  if (opts.download) {
    const dl = document.createElement("button");
    dl.type = "button";
    dl.className = "dl";
    dl.textContent = "↓ 下载";
    dl.title = "下载到本地：" + item.title;
    dl.addEventListener("click", (event) => {
      event.preventDefault();
      event.stopPropagation();
      void downloadItem(item, dl);
    });
    row.append(dl);
  }
  const open = () => {
    if (opts.onOpen) opts.onOpen(item, row, index);
  };
  if (opts.onOpen) {
    row.addEventListener("click", (event) => {
      if (event.target.closest && event.target.closest(".dl")) return;
      open();
    });
    row.addEventListener("keydown", (event) => {
      if (event.key !== "Enter" && event.key !== " ") return;
      if (event.target.closest && event.target.closest(".dl")) return;
      event.preventDefault();
      open();
    });
  }
  return row;
}

async function main() {
  let catalog;
  try {
    const response = await fetch("/_stall/catalog.json");
    if (!response.ok) throw new Error(String(response.status));
    catalog = await response.json();
  } catch (error) {
    stage.innerHTML = '<p class="empty">目录没有打开。</p>';
    return;
  }
  const items = catalog.items || [];
  const unit = { image: "张", music: "首", video: "个", novel: "篇", document: "份" }[theme] || "个";
  const blurb = items.length
    ? (items.length + " " + unit + " · " + (hints[theme] || ""))
    : "这个主题里还没有可以展示的文件。";
  lede.textContent = blurb;
  if (!items.length) {
    stage.innerHTML = '<p class="empty">这个主题里还没有可以展示的文件。</p>';
    return;
  }
  if (theme === "novel") {
    renderNovel(stage, catalog.title || "", items, blurb);
    return;
  }
  if (theme === "document") {
    renderDocs(stage, items, blurb);
    return;
  }
  if (theme === "music") {
    renderMusic(stage, items, blurb);
    return;
  }
  if (theme === "video") {
    renderVideo(stage, items, blurb);
    return;
  }
  const host = document.createElement("div");
  stage.append(host);
  const note = document.createElement("p");
  note.className = "empty";
  const paint = (shown, hiddenNote) => {
    host.replaceChildren();
    renderImages(host, shown);
    note.remove();
    if (hiddenNote) {
      note.textContent = hiddenNote;
      host.append(note);
    }
  };
  let query = "";
  const apply = () => {
    const matched = query ? items.filter((item) => String(item.title).toLowerCase().includes(query)) : items;
    const cap = caps[theme] || 400;
    const shown = matched.slice(0, cap);
    const hidden = matched.length - shown.length;
    paint(shown, hidden > 0 ? "先列出 " + shown.length + " 个。用搜索把范围缩小。" : "");
    return matched.length;
  };
  if (items.length >= 8) {
    const bar = document.createElement("div");
    bar.className = "find";
    const input = document.createElement("input");
    input.type = "search";
    input.placeholder = "找文件名";
    input.autocomplete = "off";
    input.setAttribute("aria-label", "找文件名");
    const meta = document.createElement("span");
    const hint = document.createElement("span");
    hint.className = "lede-inline";
    hint.textContent = blurb;
    bar.append(input, meta, hint);
    stage.insertBefore(bar, host);
    input.addEventListener("input", () => {
      query = input.value.trim().toLowerCase();
      meta.textContent = apply() + " / " + items.length;
    });
    meta.textContent = items.length + " 个";
  }
  apply();
  if (catalog.truncated) {
    const trunc = document.createElement("p");
    trunc.className = "empty";
    trunc.textContent = "文件太多，这次只铺开了前面的一部分。";
    stage.append(trunc);
  }
}

let lightIndex = 0;
let lightItems = [];
let lightZoom = 1;
let lightFit = true;
let lightNatural = { w: 0, h: 0 };
const lightViewport = document.getElementById("light-viewport");
const lightImg = document.getElementById("light-img");

function openLight(items, index) {
  lightItems = items;
  lightIndex = index;
  paintLight();
  document.getElementById("lightbox").hidden = false;
}
function paintLight() {
  const item = lightItems[lightIndex];
  lightFit = true;
  lightZoom = 1;
  lightNatural = { w: 0, h: 0 };
  lightImg.style.width = "";
  lightImg.style.height = "";
  lightImg.onload = () => {
    lightNatural = { w: lightImg.naturalWidth || 0, h: lightImg.naturalHeight || 0 };
    applyLightZoom();
  };
  lightImg.src = item.path;
  lightImg.alt = item.title;
  document.getElementById("light-title").textContent = item.title + " · " + formatSize(item.size);
  document.getElementById("light-count").textContent = (lightIndex + 1) + " / " + lightItems.length;
}
function applyLightZoom() {
  if (!lightNatural.w || !lightNatural.h) return;
  const pad = 8;
  const availW = Math.max(80, lightViewport.clientWidth - pad);
  const availH = Math.max(80, lightViewport.clientHeight - pad);
  let scale = lightZoom;
  if (lightFit) {
    scale = Math.min(1, availW / lightNatural.w, availH / lightNatural.h);
    lightZoom = scale;
  }
  const w = Math.max(1, Math.round(lightNatural.w * scale));
  const h = Math.max(1, Math.round(lightNatural.h * scale));
  lightImg.style.width = w + "px";
  lightImg.style.height = h + "px";
}
function setLightZoom(next, asFit) {
  lightFit = !!asFit;
  lightZoom = Math.min(6, Math.max(0.05, next));
  applyLightZoom();
}
document.getElementById("light-close").onclick = () => { document.getElementById("lightbox").hidden = true; };
document.getElementById("light-prev").onclick = () => stepLight(-1);
document.getElementById("light-next").onclick = () => stepLight(1);
document.getElementById("light-zoom-in").onclick = () => setLightZoom(lightZoom * 1.25, false);
document.getElementById("light-zoom-out").onclick = () => setLightZoom(lightZoom / 1.25, false);
document.getElementById("light-zoom-fit").onclick = () => { lightFit = true; applyLightZoom(); };
document.getElementById("light-zoom-100").onclick = () => setLightZoom(1, false);
document.getElementById("light-save").onclick = () => {
  const item = lightItems[lightIndex];
  if (item) downloadItem(item, document.getElementById("light-save"));
};
lightViewport.addEventListener("wheel", (event) => {
  if (document.getElementById("lightbox").hidden) return;
  if (!(event.ctrlKey || event.metaKey)) return;
  event.preventDefault();
  const factor = event.deltaY < 0 ? 1.1 : 1 / 1.1;
  setLightZoom(lightZoom * factor, false);
}, { passive: false });
(function bindLightPan() {
  let dragging = false;
  let startX = 0;
  let startY = 0;
  let scrollL = 0;
  let scrollT = 0;
  lightViewport.addEventListener("pointerdown", (event) => {
    if (event.button !== 0) return;
    dragging = true;
    lightViewport.classList.add("is-panning");
    startX = event.clientX;
    startY = event.clientY;
    scrollL = lightViewport.scrollLeft;
    scrollT = lightViewport.scrollTop;
    lightViewport.setPointerCapture(event.pointerId);
  });
  lightViewport.addEventListener("pointermove", (event) => {
    if (!dragging) return;
    lightViewport.scrollLeft = scrollL - (event.clientX - startX);
    lightViewport.scrollTop = scrollT - (event.clientY - startY);
  });
  const endPan = () => {
    dragging = false;
    lightViewport.classList.remove("is-panning");
  };
  lightViewport.addEventListener("pointerup", endPan);
  lightViewport.addEventListener("pointercancel", endPan);
})();
window.addEventListener("resize", () => {
  if (!document.getElementById("lightbox").hidden && lightFit) applyLightZoom();
});
function stepLight(delta) {
  if (!lightItems.length) return;
  lightIndex = (lightIndex + delta + lightItems.length) % lightItems.length;
  paintLight();
}
document.addEventListener("keydown", (event) => {
  const box = document.getElementById("lightbox");
  if (box.hidden) return;
  if (event.key === "Escape") box.hidden = true;
  if (event.key === "ArrowLeft") stepLight(-1);
  if (event.key === "ArrowRight") stepLight(1);
  if (event.key === "+" || event.key === "=") setLightZoom(lightZoom * 1.25, false);
  if (event.key === "-" || event.key === "_") setLightZoom(lightZoom / 1.25, false);
  if (event.key === "0") { lightFit = true; applyLightZoom(); }
});

function renderMusic(root, all, blurb) {
  const shell = document.createElement("div");
  shell.className = "music-shell";
  const bar = document.createElement("div");
  bar.className = "workspace-bar";
  const input = document.createElement("input");
  input.type = "search";
  input.placeholder = "找曲目";
  input.autocomplete = "off";
  const meta = document.createElement("span");
  meta.className = "meta";
  meta.textContent = blurb;
  bar.append(input, meta);

  const list = document.createElement("div");
  list.className = "playlist list";

  const dock = document.createElement("div");
  dock.className = "music-dock";
  dock.innerHTML =
    '<div class="now-copy"><p class="kicker" id="kicker">准备好了</p><h2 id="track-title">选一首</h2><p id="track-sub">点曲目开始听 · 不会自动出声</p></div>' +
    '<div class="dock-controls"><button type="button" id="prev">上一首</button><button type="button" id="next">下一首</button>' +
    '<button type="button" id="loop" aria-pressed="false" title="循环">循环</button>' +
    '<button type="button" class="dl" id="save" disabled>↓ 下载</button></div>';
  const audio = document.createElement("audio");
  audio.controls = true;
  audio.preload = "none";
  dock.querySelector(".dock-controls").prepend(audio);

  shell.append(bar, list, dock);
  root.replaceChildren(shell);

  let cursor = -1;
  let loopMode = false;
  const saveBtn = dock.querySelector("#save");
  const loopBtn = dock.querySelector("#loop");
  saveBtn.onclick = () => {
    if (cursor < 0) return;
    void downloadItem(all[cursor], saveBtn);
  };
  loopBtn.onclick = () => {
    loopMode = !loopMode;
    loopBtn.setAttribute("aria-pressed", loopMode ? "true" : "false");
    loopBtn.textContent = loopMode ? "循环·开" : "循环";
  };

  const sub = () => document.getElementById("track-sub");
  const showBuffer = () => {
    const title = audio.dataset.title || "";
    if (!audio.buffered.length || !isFinite(audio.duration) || audio.duration <= 0) {
      sub().textContent = title ? "正在打开 " + title : "点曲目开始听 · 不会自动出声";
      return;
    }
    if (!audio.paused && audio.readyState >= 3) {
      sub().textContent = formatSize(all[cursor] && all[cursor].size);
      return;
    }
    const end = audio.buffered.end(audio.buffered.length - 1);
    sub().textContent = "正在缓冲 " + Math.min(99, Math.round(end / audio.duration * 100)) + "%";
  };
  audio.addEventListener("waiting", showBuffer);
  audio.addEventListener("progress", showBuffer);
  audio.addEventListener("playing", () => {
    document.getElementById("kicker").textContent = "正在听";
    sub().textContent = formatSize(all[cursor] && all[cursor].size);
  });
  audio.addEventListener("pause", () => {
    if (audio.ended || cursor < 0) return;
    document.getElementById("kicker").textContent = "已暂停";
  });

  function mark() {
    const current = all[cursor];
    list.querySelectorAll(".row").forEach((node) => {
      if (current && node.dataset.path === current.path) node.setAttribute("aria-current", "true");
      else node.removeAttribute("aria-current");
    });
  }
  let blobUrl = "";
  let playToken = 0;
  function failPlay(message) {
    document.getElementById("kicker").textContent = "播不了";
    sub().textContent = message || "请再点一次";
  }
  audio.addEventListener("error", () => {
    const code = audio.error && audio.error.code;
    if (code === 4) failPlay("格式或响应不被支持，正在改用整段缓冲…");
  });
  async function playAt(index) {
    if (index < 0 || index >= all.length) return;
    const token = ++playToken;
    cursor = index;
    const item = all[index];
    document.getElementById("kicker").textContent = "正在打开";
    document.getElementById("track-title").textContent = item.title;
    sub().textContent = "正在拉取 " + formatSize(item.size);
    audio.dataset.title = item.title;
    if (blobUrl) {
      URL.revokeObjectURL(blobUrl);
      blobUrl = "";
    }
    saveBtn.disabled = false;
    mark();
    try {
      const res = await fetch(item.path);
      if (token !== playToken) return;
      if (!res.ok) {
        const detail = (await res.text()).trim().slice(0, 160);
        throw new Error(detail || ("取歌失败 " + res.status));
      }
      const blob = await res.blob();
      if (token !== playToken) return;
      if (!blob.size) throw new Error("拉到的歌是空的");
      blobUrl = URL.createObjectURL(blob);
      audio.src = blobUrl;
      await audio.play();
    } catch (error) {
      if (token !== playToken) return;
      failPlay((error && error.message) || "请再点一次");
    }
  }
  dock.querySelector("#prev").onclick = () => playAt(cursor < 0 ? 0 : cursor - 1);
  dock.querySelector("#next").onclick = () => playAt(cursor < 0 ? 0 : cursor + 1);
  audio.addEventListener("ended", () => {
    if (loopMode && cursor >= 0) {
      playAt(cursor);
      return;
    }
    if (cursor + 1 < all.length) playAt(cursor + 1);
    else document.getElementById("kicker").textContent = "最后一首听完了";
  });
  document.addEventListener("keydown", (event) => {
    if (typing(event) || !document.getElementById("lightbox").hidden) return;
    if (event.key === " " && cursor >= 0) {
      event.preventDefault();
      if (audio.paused) audio.play();
      else audio.pause();
    }
    if (event.key === "ArrowDown") { event.preventDefault(); playAt(cursor + 1); }
    if (event.key === "ArrowUp") { event.preventDefault(); playAt(cursor - 1); }
  });

  const paint = () => {
    const query = input.value.trim().toLowerCase();
    const matched = query
      ? all.filter((item) => String(item.title).toLowerCase().includes(query))
      : all;
    const shown = matched.slice(0, caps.music || 400);
    meta.textContent = (query ? matched.length + " / " + all.length + " · " : "") + blurb;
    list.replaceChildren();
    shown.forEach((item) => {
      const index = all.indexOf(item);
      list.append(makeFileRow(item, index, {
        download: true,
        onOpen: (_item, _button, i) => playAt(i),
      }));
    });
    mark();
  };
  input.addEventListener("input", paint);
  paint();
}

    const shown = matched.slice(0, caps.novel || 400);
    meta.textContent =
      (query ? matched.length + " / " + items.length + " · " : "") + blurb;
    paintShelf(shown);
  };
  input.addEventListener("input", apply);

  document.getElementById("smaller").onclick = () => resize(-1);
  document.getElementById("larger").onclick = () => resize(1);
  document.getElementById("paper").onclick = () => {
    const night = document.body.dataset.paper !== "night";
    if (night) document.body.dataset.paper = "night";
    else delete document.body.dataset.paper;
    localStorage.setItem("popstall-paper", night ? "night" : "day");
  };
  document.addEventListener("keydown", (event) => {
    if (typing(event) || !document.getElementById("lightbox").hidden) return;
    if (event.key === "ArrowRight" || event.key === "PageDown" || event.key === " ") {
      event.preventDefault();
      if (active && active.turn) active.turn(1);
    }
    if (event.key === "ArrowLeft" || event.key === "PageUp") {
      event.preventDefault();
      if (active && active.turn) active.turn(-1);
    }
  });
  apply();
}

function resize(delta) {
  const current = Number(getComputedStyle(document.documentElement).getPropertyValue("--read").replace("px", "")) || 18;
  const next = Math.min(28, Math.max(15, current + delta));
  document.documentElement.style.setProperty("--read", next + "px");
  localStorage.setItem("popstall-read-size", String(next));
}

/** Roughly one screen of Chinese prose at default size. */
const NOVEL_PAGE_CHARS = 1400;

function decodeTextBytes(buffer) {
  const bytes = new Uint8Array(buffer);
  if (bytes.length >= 3 && bytes[0] === 0xef && bytes[1] === 0xbb && bytes[2] === 0xbf) {
    return new TextDecoder("utf-8").decode(bytes.subarray(3));
  }
  if (bytes.length >= 2 && bytes[0] === 0xff && bytes[1] === 0xfe) {
    return new TextDecoder("utf-16le").decode(bytes.subarray(2));
  }
  if (bytes.length >= 2 && bytes[0] === 0xfe && bytes[1] === 0xff) {
    return new TextDecoder("utf-16be").decode(bytes.subarray(2));
  }
  const sample = bytes.subarray(0, Math.min(bytes.length, 8192));
  try {
    new TextDecoder("utf-8", { fatal: true }).decode(sample);
    return new TextDecoder("utf-8").decode(bytes);
  } catch (_) {}
  for (const label of ["gb18030", "gbk", "big5"]) {
    try {
      return new TextDecoder(label).decode(bytes);
    } catch (_) {}
  }
  return new TextDecoder("utf-8").decode(bytes);
}

function breakNovelPages(text) {
  const pages = [];
  let cursor = 0;
  const total = text.length;
  while (cursor < total) {
    let end = Math.min(cursor + NOVEL_PAGE_CHARS, total);
    if (end < total) {
      const window = text.slice(cursor, Math.min(end + 120, total));
      const breakAt = Math.max(
        window.lastIndexOf("\n\n"),
        window.lastIndexOf("。"),
        window.lastIndexOf("！"),
        window.lastIndexOf("？"),
        window.lastIndexOf("\n")
      );
      if (breakAt > NOVEL_PAGE_CHARS * 0.55) end = cursor + breakAt + 1;
    }
    pages.push(text.slice(cursor, end));
    cursor = end;
  }
  return pages.length ? pages : [""];
}

function bindNovelPager(pager, article, pages, startPage, pageKey, path) {
  let idx = Math.min(Math.max(0, startPage), pages.length - 1);
  const prev = document.createElement("button");
  prev.type = "button";
  prev.textContent = "上一页";
  const meta = document.createElement("span");
  meta.className = "page-meta";
  const next = document.createElement("button");
  next.type = "button";
  next.textContent = "下一页";
  pager.replaceChildren(prev, meta, next);
  pager.hidden = false;
  const paint = () => {
    article.style.whiteSpace = "pre-wrap";
    article.textContent = pages[idx] || "（这一页没有文字）";
    article.scrollTop = 0;
    meta.textContent = "第 " + (idx + 1) + " / " + pages.length + " 页";
    prev.disabled = idx <= 0;
    next.disabled = idx >= pages.length - 1;
    try {
      localStorage.setItem(pageKey + ":" + path, String(idx));
    } catch (_) {}
  };
  const turn = (delta) => {
    const nextIdx = idx + delta;
    if (nextIdx < 0 || nextIdx >= pages.length) return;
    idx = nextIdx;
    paint();
  };
  prev.onclick = () => turn(-1);
  next.onclick = () => turn(1);
  paint();
  return { turn };
}

function openChapter(item, button, list, article, pager, memoryKey, pageKey) {
  list.querySelectorAll(".row").forEach((node) => node.removeAttribute("aria-current"));
  button.setAttribute("aria-current", "true");
  localStorage.setItem(memoryKey, item.path);
  article.style.whiteSpace = "normal";
  article.textContent = "正在翻开…";
  pager.hidden = true;
  let alive = true;
  const handle = {
    turn(delta) {
      if (alive && handle._session) handle._session.turn(delta);
    },
    abort() {
      alive = false;
    },
    _session: null,
  };
  (async () => {
    try {
      const response = await fetch(item.path);
      if (!alive) return;
      if (!response.ok) {
        article.textContent = "这一章打不开（" + response.status + "）。换一章或返回重进摊位。";
        return;
      }
      const buffer = await response.arrayBuffer();
      if (!alive) return;
      if (!buffer.byteLength) {
        article.textContent = "这一章是空的。";
        return;
      }
      const text = decodeTextBytes(buffer).replace(/^\uFEFF/, "");
      if (!text.trim()) {
        article.textContent = "解出来没有可读文字。若是扫描版，请改用文档主题看 PDF。";
        return;
      }
      const lower = item.path.toLowerCase().split(/[?#]/)[0];
      const usePages = lower.endsWith(".txt") || text.length > NOVEL_PAGE_CHARS * 2;
      if (usePages) {
        const pages = breakNovelPages(text);
        let start = 0;
        try {
          start = Number(localStorage.getItem(pageKey + ":" + item.path) || "0") || 0;
        } catch (_) {}
        handle._session = bindNovelPager(pager, article, pages, start, pageKey, item.path);
        return;
      }
      pager.hidden = true;
      article.innerHTML = markdown(text);
    } catch (error) {
      if (!alive) return;
      article.textContent = "这一章加载失败：" + (error && error.message ? error.message : "网络中断");
    }
  })();
  return handle;
}

function markdown(raw) {
  const lines = String(raw).replaceAll("\r\n", "\n").split("\n");
  let html = "";
  let list = false;
  let code = false;
  let buffer = "";
  const flush = () => {
    if (!buffer.trim()) { buffer = ""; return; }
    html += "<p>" + inline(buffer.trim()) + "</p>";
    buffer = "";
  };
  for (const line of lines) {
    if (line.startsWith("```")) {
      if (code) { html += "<pre><code>" + esc(buffer) + "</code></pre>"; buffer = ""; code = false; }
      else { flush(); code = true; }
      continue;
    }
    if (code) { buffer += (buffer ? "\n" : "") + line; continue; }
    if (/^[-*] /.test(line)) {
      flush();
      if (!list) { html += "<ul>"; list = true; }
      html += "<li>" + inline(line.slice(2)) + "</li>";
      continue;
    }
    if (list) { html += "</ul>"; list = false; }
    if (line.startsWith("### ")) { flush(); html += "<h3>" + inline(line.slice(4)) + "</h3>"; continue; }
    if (line.startsWith("## ")) { flush(); html += "<h2>" + inline(line.slice(3)) + "</h2>"; continue; }
    if (line.startsWith("# ")) { flush(); html += "<h2>" + inline(line.slice(2)) + "</h2>"; continue; }
    if (!line.trim()) flush();
    else buffer += (buffer ? " " : "") + line;
  }
  if (code) html += "<pre><code>" + esc(buffer) + "</code></pre>";
  else flush();
  if (list) html += "</ul>";
  return html;
}

function inline(value) {
  return esc(value)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\[([^\]]+)\]\((\/[^)\s]*)\)/g, '<a href="$2">$1</a>');
}

let pdfjsLib = null;
async function loadPdfjs() {
  if (pdfjsLib) return pdfjsLib;
  pdfjsLib = await import("/_stall/pdfjs/pdf.min.mjs");
  pdfjsLib.GlobalWorkerOptions.workerSrc = "/_stall/pdfjs/pdf.worker.min.mjs";
  return pdfjsLib;
}

function renderDocs(root, items, blurb) {
  const workspace = document.createElement("div");
  workspace.className = "workspace";
  const bar = document.createElement("div");
  bar.className = "workspace-bar";
  const input = document.createElement("input");
  input.type = "search";
  input.placeholder = "找文件名";
  input.autocomplete = "off";
  const barMeta = document.createElement("span");
  barMeta.className = "meta";
  barMeta.textContent = blurb;
  const tools = document.createElement("div");
  tools.className = "tools";
  const saveBtn = document.createElement("button");
  saveBtn.type = "button";
  saveBtn.className = "dl";
  saveBtn.id = "doc-save";
  saveBtn.textContent = "↓ 下载";
  saveBtn.disabled = true;
  tools.append(saveBtn);
  bar.append(input, barMeta, tools);

  const side = document.createElement("div");
  side.className = "side list";
  const pane = document.createElement("div");
  pane.className = "pane";
  const pdfPane = document.createElement("div");
  pdfPane.className = "pdf-pane";
  pdfPane.hidden = true;
  const pager = document.createElement("div");
  pager.className = "pager";
  const scroll = document.createElement("div");
  scroll.className = "pdf-scroll";
  const canvas = document.createElement("canvas");
  scroll.append(canvas);
  pdfPane.append(pager, scroll);
  const status = document.createElement("div");
  status.className = "doc-status";
  status.textContent = "选一份文档打开。";
  pane.append(pdfPane, status);
  workspace.append(bar, side, pane);
  root.replaceChildren(workspace);

  let openToken = 0;
  let pdfDoc = null;
  let pageNo = 1;
  let currentDoc = null;
  const prev = document.createElement("button");
  prev.type = "button";
  prev.textContent = "上一页";
  const pageMeta = document.createElement("span");
  pageMeta.className = "page-meta";
  const next = document.createElement("button");
  next.type = "button";
  next.textContent = "下一页";
  pager.append(prev, pageMeta, next);
  saveBtn.onclick = () => {
    if (!currentDoc) return;
    void downloadItem(currentDoc, saveBtn);
  };

  async function paintPdfPage() {
    if (!pdfDoc) return;
    const page = await pdfDoc.getPage(pageNo);
    const base = page.getViewport({ scale: 1 });
    const width = Math.max(320, scroll.clientWidth - 24);
    const scale = width / base.width;
    const viewport = page.getViewport({ scale: Math.min(scale, 2.2) });
    const ratio = window.devicePixelRatio || 1;
    canvas.width = Math.floor(viewport.width * ratio);
    canvas.height = Math.floor(viewport.height * ratio);
    canvas.style.width = Math.floor(viewport.width) + "px";
    canvas.style.height = Math.floor(viewport.height) + "px";
    const ctx = canvas.getContext("2d");
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    await page.render({ canvasContext: ctx, viewport }).promise;
    pageMeta.textContent = pageNo + " / " + pdfDoc.numPages;
    prev.disabled = pageNo <= 1;
    next.disabled = pageNo >= pdfDoc.numPages;
    scroll.scrollTop = 0;
  }

  prev.onclick = () => {
    if (pageNo <= 1) return;
    pageNo -= 1;
    void paintPdfPage();
  };
  next.onclick = () => {
    if (!pdfDoc || pageNo >= pdfDoc.numPages) return;
    pageNo += 1;
    void paintPdfPage();
  };

  async function openDoc(item, button) {
    const token = ++openToken;
    currentDoc = item;
    saveBtn.disabled = false;
    side.querySelectorAll(".row").forEach((node) => node.removeAttribute("aria-current"));
    button.setAttribute("aria-current", "true");
    pdfPane.hidden = true;
    status.hidden = false;
    status.textContent = "正在拉取 " + item.title + "（" + formatSize(item.size) + "）…";
    pdfDoc = null;
    try {
      const res = await fetch(item.path);
      if (token !== openToken) return;
      if (!res.ok) {
        const detail = (await res.text()).trim().slice(0, 160);
        throw new Error(detail || ("打开失败 " + res.status));
      }
      const buffer = await res.arrayBuffer();
      if (token !== openToken) return;
      if (!buffer.byteLength) throw new Error("文件是空的");
      status.textContent = "正在排版 PDF…";
      const pdfjs = await loadPdfjs();
      if (token !== openToken) return;
      const task = pdfjs.getDocument({ data: new Uint8Array(buffer) });
      pdfDoc = await task.promise;
      if (token !== openToken) return;
      pageNo = 1;
      pdfPane.hidden = false;
      status.hidden = true;
      await paintPdfPage();
    } catch (error) {
      if (token !== openToken) return;
      pdfPane.hidden = true;
      status.hidden = false;
      status.textContent = (error && error.message) || "这份文档打不开";
    }
  }

  const paintList = (shown) => {
    side.replaceChildren();
    shown.forEach((item, index) => {
      const button = makeFileRow(item, index, {
        download: true,
        onOpen: (opened, row) => openDoc(opened, row),
      });
      side.append(button);
    });
    if (shown.length === 1) openDoc(shown[0], side.firstChild);
  };

  const apply = () => {
    const query = input.value.trim().toLowerCase();
    const matched = query
      ? items.filter((item) => String(item.title).toLowerCase().includes(query))
      : items;
    const shown = matched.slice(0, caps.document || 200);
    barMeta.textContent =
      (query ? matched.length + " / " + items.length + " · " : "") + blurb;
    paintList(shown);
  };
  input.addEventListener("input", apply);
  apply();
}

function typing(event) {
  const target = event.target;
  if (!target || !target.tagName) return false;
  const tag = target.tagName;
  return tag === "INPUT" || tag === "TEXTAREA" || target.isContentEditable;
}

main();
</script>
