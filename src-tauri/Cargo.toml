[package]
name = "popstall"
version = "0.1.0"
description = "PopStall desktop client: publish a local folder over an encrypted iroh connection."
license = "Apache-2.0"
edition = "2024"

[lib]
name = "popstall_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aead = "0.5"
aes-gcm = "0.10"
anyhow = "1"
axum = "0.8"
blake3 = "1.8"
bytes = "1"
futures-util = "0.3"
hkdf = "0.12"
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
iroh = "1.5"
noq-proto = { version = "1.5", default-features = false }
iroh-dns = "1.5"
iroh-gossip = "0.103"
iroh-mainline-address-lookup = "0.4"
iroh-mdns-address-lookup = "0.5"
iroh-tickets = "1.0"
mime_guess = "2"
percent-encoding = "2"
portmapper = "0.20"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
serde_json = "1"
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
